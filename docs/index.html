<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點擊遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: #fff;
        }

        #clickButton {
            padding: 10px 20px;
            font-size: 18px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #clickButton:hover {
            background-color: #0056b3;
        }

        #counter {
            margin-top: 20px;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>點擊遊戲</h1>
        <button id="clickButton">點我！</button>
        <div id="counter">點擊次數: 0</div>
    </div>

    <script>
        let count = 0;

        document.getElementById('clickButton').addEventListener('click', function() {
            count++;
            document.getElementById('counter').innerText = '點擊次數: ' + count;
        });
    </script>
</body>
</html>
